name: CI

on:
  push:
    branches: [master, portfolio/public-readiness]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/finance-tracker-test
      JWT_SECRET: ci-only-secret-not-for-production
      JWT_EXPIRES_IN: 1h
      ALLOWED_ORIGIN: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --runInBand

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build Docker image
        run: docker build -t finance-tracker-api:ci .
