version: '3.8'

services:
  api:
    build: .
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongo:27017/finance-tracker
      - JWT_SECRET=your_jwt_secret_key_here
      - PORT=5000
    depends_on:
      - mongo
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - finance-network

  mongo:
    image: mongo:6.0-alpine
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=finance-tracker
    volumes:
      - mongo-data:/data/db
    networks:
      - finance-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:

networks:
  finance-network:
    driver: bridge
